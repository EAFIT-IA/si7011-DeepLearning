<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#ffffff"/>
  <style>
    .title{font:700 52px Arial,Helvetica,sans-serif;fill:#102354}
    .h{font:700 32px Arial,Helvetica,sans-serif;fill:#172033}
    .t{font:26px Arial,Helvetica,sans-serif;fill:#172033}
    .s{font:22px Arial,Helvetica,sans-serif;fill:#445064}
    .m{font:italic 32px Georgia,'Times New Roman',serif;fill:#101820}
    .mm{font:italic 38px Georgia,'Times New Roman',serif;fill:#101820}
    .code{font:26px 'Courier New',monospace;fill:#2255cc}
    .box{stroke-width:2;rx:18;ry:18}
    .arrow{stroke:#172033;stroke-width:4;fill:none;marker-end:url(#arr)}
  </style>
  <defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#172033"/></marker></defs>
  <text x="800" y="70" text-anchor="middle" class="title">What the loss function expects in PyTorch</text>
  
  <text x="80" y="135" class="h">Task</text><text x="390" y="135" class="h">Model output</text><text x="745" y="135" class="h">Target</text><text x="1050" y="135" class="h">Loss in PyTorch</text><text x="1390" y="135" class="h">Shapes</text>
  <rect x="45" y="165" width="1510" height="180" rx="22" fill="#edf6ff"/>
  <text x="80" y="225" class="h">Regression</text>
  <text x="390" y="245" class="m">ŷ ∈ ℝ</text>
  <text x="745" y="245" class="m">y ∈ ℝ</text>
  <text x="1050" y="245" class="code">nn.MSELoss</text>
  <text x="1390" y="225" class="s">output (B,) or (B,1)</text><text x="1390" y="265" class="s">target: same shape, float</text>

  <rect x="45" y="365" width="1510" height="205" rx="22" fill="#f2fbef"/>
  <text x="80" y="425" class="h">Binary classification</text>
  <text x="390" y="445" class="m">z ∈ ℝ</text><text x="390" y="490" class="s">optional: p̂ = σ(z)</text>
  <text x="745" y="445" class="m">y ∈ {0,1}</text>
  <text x="1050" y="445" class="code">nn.BCEWithLogitsLoss</text>
  <text x="1050" y="495" class="s">expects logits, not probabilities</text>
  <text x="1390" y="425" class="s">logits (B,) or (B,1)</text><text x="1390" y="465" class="s">target: same shape, float</text>

  <rect x="45" y="590" width="1510" height="205" rx="22" fill="#f3efff"/>
  <text x="80" y="650" class="h">Multiclass classification</text>
  <text x="390" y="670" class="m">z ∈ ℝᶜ</text><text x="390" y="715" class="s">optional: p = softmax(z)</text>
  <text x="745" y="670" class="m">y ∈ {0,…,C−1}</text>
  <text x="1050" y="670" class="code">nn.CrossEntropyLoss</text>
  <text x="1050" y="720" class="s">expects logits and class indices</text>
  <text x="1390" y="650" class="s">logits (B,C)</text><text x="1390" y="690" class="s">target (B,), long</text>

  <text x="800" y="855" text-anchor="middle" class="h">Sigmoid/softmax are useful for interpretation; these losses consume raw logits.</text>

</svg>