<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#ffffff"/>
<style>
.title{font:700 46px Arial,Helvetica,sans-serif;fill:#153b63}
.h{font:700 27px Arial,Helvetica,sans-serif;fill:#172033}
.t{font:23px Arial,Helvetica,sans-serif;fill:#172033}
.s{font:20px Arial,Helvetica,sans-serif;fill:#4b596b}
.m{font:italic 29px 'DejaVu Serif','STIX Two Text','Times New Roman',serif;fill:#172033}
.mm{font:italic 34px 'DejaVu Serif','STIX Two Text','Times New Roman',serif;fill:#172033}
.back{stroke:#d9631e;stroke-width:4;fill:none;marker-end:url(#b)}
</style>
<defs>
<marker id="b" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
<path d="M0,0 L12,6 L0,12 z" fill="#d9631e"/>
</marker>
</defs>

<text x="800" y="68" text-anchor="middle" class="title">Backward pass: signals and parameter gradients</text>
<text x="800" y="112" text-anchor="middle" class="s">For a linear output and squared loss: L = 1/2 ||ŷ - y||²</text>

<!-- Seed -->
<rect x="1120" y="160" width="390" height="145" rx="20" fill="#fdeee3" stroke="#d9631e" stroke-width="2"/>
<text x="1315" y="202" text-anchor="middle" class="h">Backward starts at the loss</text>
<text x="1315" y="246" text-anchor="middle" class="m">δ<tspan baseline-shift="sub" font-size="18">ŷ</tspan> = ∂L/∂ŷ = ŷ - y</text>
<text x="1315" y="282" text-anchor="middle" class="s">seed gradient at the model output</text>

<!-- Signal boxes -->
<rect x="1170" y="390" width="300" height="120" rx="18" fill="#fff6eb" stroke="#d9631e" stroke-width="2"/>
<text x="1320" y="430" text-anchor="middle" class="h">Through output layer</text>
<text x="1320" y="475" text-anchor="middle" class="m">δ<tspan baseline-shift="sub" font-size="18">a₂</tspan> = W₃ᵀ δ<tspan baseline-shift="sub" font-size="18">ŷ</tspan></text>

<rect x="820" y="390" width="300" height="120" rx="18" fill="#fff6eb" stroke="#d9631e" stroke-width="2"/>
<text x="970" y="430" text-anchor="middle" class="h">Through activation φ</text>
<text x="970" y="475" text-anchor="middle" class="m">δ<tspan baseline-shift="sub" font-size="18">z₂</tspan> = δ<tspan baseline-shift="sub" font-size="18">a₂</tspan> ⊙ φ'(z₂)</text>

<rect x="470" y="390" width="300" height="120" rx="18" fill="#fff6eb" stroke="#d9631e" stroke-width="2"/>
<text x="620" y="430" text-anchor="middle" class="h">Through hidden affine</text>
<text x="620" y="475" text-anchor="middle" class="m">δ<tspan baseline-shift="sub" font-size="18">a₁</tspan> = W₂ᵀ δ<tspan baseline-shift="sub" font-size="18">z₂</tspan></text>

<rect x="120" y="390" width="300" height="120" rx="18" fill="#fff6eb" stroke="#d9631e" stroke-width="2"/>
<text x="270" y="430" text-anchor="middle" class="h">Through activation φ</text>
<text x="270" y="475" text-anchor="middle" class="m">δ<tspan baseline-shift="sub" font-size="18">z₁</tspan> = δ<tspan baseline-shift="sub" font-size="18">a₁</tspan> ⊙ φ'(z₁)</text>

<!-- Arrows placed between boxes, never through labels -->
<path d="M1315 305 V365 H1320 V385" class="back"/>
<path d="M1170 450 H1130" class="back"/>
<path d="M820 450 H780" class="back"/>
<path d="M470 450 H430" class="back"/>

<!-- Parameter gradients -->
<rect x="85" y="590" width="1430" height="235" rx="22" fill="#f8fafc" stroke="#c8d1dc" stroke-width="2"/>
<text x="800" y="635" text-anchor="middle" class="h">Parameter gradients from the same backward signals</text>

<line x1="555" y1="655" x2="555" y2="800" stroke="#d6dde6" stroke-width="2"/>
<line x1="1040" y1="655" x2="1040" y2="800" stroke="#d6dde6" stroke-width="2"/>

<text x="315" y="690" text-anchor="middle" class="h">Output layer</text>
<text x="315" y="735" text-anchor="middle" class="m">∇<tspan baseline-shift="sub" font-size="18">W₃</tspan>L = δ<tspan baseline-shift="sub" font-size="18">ŷ</tspan> a₂ᵀ</text>
<text x="315" y="778" text-anchor="middle" class="m">∇<tspan baseline-shift="sub" font-size="18">b₃</tspan>L = δ<tspan baseline-shift="sub" font-size="18">ŷ</tspan></text>

<text x="795" y="690" text-anchor="middle" class="h">Hidden layer 2</text>
<text x="795" y="735" text-anchor="middle" class="m">∇<tspan baseline-shift="sub" font-size="18">W₂</tspan>L = δ<tspan baseline-shift="sub" font-size="18">z₂</tspan> a₁ᵀ</text>
<text x="795" y="778" text-anchor="middle" class="m">∇<tspan baseline-shift="sub" font-size="18">b₂</tspan>L = δ<tspan baseline-shift="sub" font-size="18">z₂</tspan></text>

<text x="1280" y="690" text-anchor="middle" class="h">Hidden layer 1</text>
<text x="1280" y="735" text-anchor="middle" class="m">∇<tspan baseline-shift="sub" font-size="18">W₁</tspan>L = δ<tspan baseline-shift="sub" font-size="18">z₁</tspan> xᵀ</text>
<text x="1280" y="778" text-anchor="middle" class="m">∇<tspan baseline-shift="sub" font-size="18">b₁</tspan>L = δ<tspan baseline-shift="sub" font-size="18">z₁</tspan></text>

<text x="800" y="865" text-anchor="middle" class="s">Backward propagates signals; each affine layer uses its signal to compute gradients for both W and b.</text>
</svg>