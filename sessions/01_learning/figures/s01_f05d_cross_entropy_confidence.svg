<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#ffffff"/>
<style>
.title{font:700 52px Arial,Helvetica,sans-serif;fill:#102354}
.h{font:700 30px Arial,Helvetica,sans-serif;fill:#172033}
.t{font:24px Arial,Helvetica,sans-serif;fill:#172033}
.s{font:20px Arial,Helvetica,sans-serif;fill:#445064}
.m{font:italic 30px Georgia,'Times New Roman',serif;fill:#101820}
.mm{font:italic 36px Georgia,'Times New Roman',serif;fill:#101820}
.code{font:25px 'Courier New',monospace;fill:#2255cc}
.arrow{stroke:#172033;stroke-width:4;fill:none;marker-end:url(#arr)}
.sep{stroke:#cbd5df;stroke-width:2}
</style>
<defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#172033"/></marker></defs>
<text x="800" y="70" text-anchor="middle" class="title">Cross-entropy intuition: confidence matters</text>
<rect x="40" y="115" width="735" height="650" rx="24" fill="#f2fbef"/>
<rect x="825" y="115" width="735" height="650" rx="24" fill="#eef6ff"/>

<text x="75" y="165" class="h">Binary classification</text>
<text x="75" y="205" class="s">True label y = 1</text>

<text x="75" y="260" class="t">Prediction</text>
<text x="295" y="260" class="t">Interpretation</text>
<text x="665" y="260" class="t">Loss</text>
<line x1="70" y1="280" x2="745" y2="280" class="sep"/>

<text x="85" y="345" class="m">p = 0.9</text>
<rect x="275" y="305" width="320" height="60" rx="14" fill="#e1f5dd"/>
<text x="435" y="343" text-anchor="middle" class="t">correct, high confidence</text>
<text x="675" y="345" class="m">0.105</text>

<text x="85" y="455" class="m">p = 0.6</text>
<rect x="275" y="415" width="320" height="60" rx="14" fill="#e7f1ff"/>
<text x="435" y="453" text-anchor="middle" class="t">correct, low confidence</text>
<text x="675" y="455" class="m">0.511</text>

<text x="85" y="565" class="m">p = 0.1</text>
<rect x="275" y="525" width="320" height="60" rx="14" fill="#ffe4e2"/>
<text x="435" y="563" text-anchor="middle" class="t">wrong, high confidence</text>
<text x="675" y="565" class="m">2.303</text>

<text x="860" y="165" class="h">Multiclass classification</text>
<text x="860" y="205" class="s">True class y = 2</text>
<text x="860" y="260" class="t">Predicted probabilities</text>
<text x="1170" y="260" class="t">Interpretation</text>
<text x="1480" y="260" class="t">Loss</text>
<line x1="855" y1="280" x2="1530" y2="280" class="sep"/>

<text x="865" y="345" class="m">[0.1, 0.8, 0.1]</text>
<rect x="1150" y="305" width="270" height="60" rx="14" fill="#e1f5dd"/>
<text x="1285" y="333" text-anchor="middle" class="t">correct</text>
<text x="1285" y="360" text-anchor="middle" class="s">high confidence</text>
<text x="1480" y="345" class="m">0.223</text>

<text x="865" y="455" class="m">[0.2, 0.5, 0.3]</text>
<rect x="1150" y="415" width="270" height="60" rx="14" fill="#e7f1ff"/>
<text x="1285" y="443" text-anchor="middle" class="t">correct</text>
<text x="1285" y="470" text-anchor="middle" class="s">low confidence</text>
<text x="1480" y="455" class="m">0.693</text>

<text x="865" y="565" class="m">[0.7, 0.2, 0.1]</text>
<rect x="1150" y="525" width="270" height="60" rx="14" fill="#ffe4e2"/>
<text x="1285" y="553" text-anchor="middle" class="t">wrong</text>
<text x="1285" y="580" text-anchor="middle" class="s">high confidence</text>
<text x="1480" y="565" class="m">1.609</text>

<rect x="80" y="795" width="1440" height="70" rx="20" fill="#f3efff"/>
<text x="800" y="838" text-anchor="middle" class="h">More probability on the true class means lower cross-entropy.</text>
</svg>