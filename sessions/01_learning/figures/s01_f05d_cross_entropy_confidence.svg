<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#ffffff"/>
  <style>
    .title{font:700 52px Arial,Helvetica,sans-serif;fill:#102354}
    .h{font:700 32px Arial,Helvetica,sans-serif;fill:#172033}
    .t{font:26px Arial,Helvetica,sans-serif;fill:#172033}
    .s{font:22px Arial,Helvetica,sans-serif;fill:#445064}
    .m{font:italic 32px Georgia,'Times New Roman',serif;fill:#101820}
    .mm{font:italic 38px Georgia,'Times New Roman',serif;fill:#101820}
    .code{font:26px 'Courier New',monospace;fill:#2255cc}
    .box{stroke-width:2;rx:18;ry:18}
    .arrow{stroke:#172033;stroke-width:4;fill:none;marker-end:url(#arr)}
  </style>
  <defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#172033"/></marker></defs>
  <text x="800" y="70" text-anchor="middle" class="title">Cross-entropy intuition: confidence matters</text>
  
  <rect x="45" y="115" width="740" height="660" rx="24" fill="#f2fbef"/>
  <rect x="815" y="115" width="740" height="660" rx="24" fill="#eef6ff"/>
  <text x="80" y="170" class="h">Binary · true label y = 1</text>
  <text x="850" y="170" class="h">Multiclass · true class y = 2</text>

  <text x="85" y="235" class="t">Prediction</text><text x="410" y="235" class="t">Interpretation</text><text x="680" y="235" class="t">Loss</text>
  <line x1="75" y1="255" x2="755" y2="255" stroke="#cad4dd" stroke-width="2"/>
  <text x="90" y="325" class="m">p̂ = 0.9</text><text x="410" y="325" class="t">correct, high confidence</text><text x="690" y="325" class="m">0.105</text>
  <text x="90" y="430" class="m">p̂ = 0.6</text><text x="410" y="430" class="t">correct, low confidence</text><text x="690" y="430" class="m">0.511</text>
  <text x="90" y="535" class="m">p̂ = 0.1</text><text x="410" y="535" class="t">wrong, high confidence</text><text x="690" y="535" class="m">2.303</text>
  <rect x="385" y="292" width="240" height="55" rx="14" fill="#e1f5dd"/><rect x="385" y="397" width="240" height="55" rx="14" fill="#e7f1ff"/><rect x="385" y="502" width="240" height="55" rx="14" fill="#ffe4e2"/>

  <text x="850" y="235" class="t">Probabilities [p₁,p₂,p₃]</text><text x="1210" y="235" class="t">Interpretation</text><text x="1480" y="235" class="t">Loss</text>
  <line x1="845" y1="255" x2="1525" y2="255" stroke="#cad4dd" stroke-width="2"/>
  <text x="855" y="325" class="m">[0.1, 0.8, 0.1]</text><text x="1210" y="325" class="t">correct, high confidence</text><text x="1485" y="325" class="m">0.223</text>
  <text x="855" y="430" class="m">[0.2, 0.5, 0.3]</text><text x="1210" y="430" class="t">correct, low confidence</text><text x="1485" y="430" class="m">0.693</text>
  <text x="855" y="535" class="m">[0.7, 0.2, 0.1]</text><text x="1210" y="535" class="t">wrong, high confidence</text><text x="1485" y="535" class="m">1.609</text>
  <rect x="1190" y="292" width="250" height="55" rx="14" fill="#e1f5dd"/><rect x="1190" y="397" width="250" height="55" rx="14" fill="#e7f1ff"/><rect x="1190" y="502" width="250" height="55" rx="14" fill="#ffe4e2"/>

  <rect x="70" y="650" width="1460" height="95" rx="20" fill="#f3efff"/>
  <text x="800" y="690" text-anchor="middle" class="h">Cross-entropy depends on confidence, not only on the predicted label.</text>
  <text x="800" y="730" text-anchor="middle" class="t">It decreases as probability assigned to the true class increases.</text>

</svg>