<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="desc">
  <desc id="desc">Ciclo de aprendizaje. El modelo produce una predicción, la pérdida la compara con el target, backward calcula los gradientes y SGD actualiza los parámetros para la siguiente iteración.</desc>
  <defs>
    <marker id="forward" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker>
    <marker id="backward" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#cb6658"/></marker>
    <marker id="update" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#27817f"/></marker>
    <style>
      .label {font-family:Arial,Helvetica,sans-serif;font-size:32px;font-weight:600;fill:#15263b}
      .caption {font-family:Arial,Helvetica,sans-serif;font-size:25px;fill:#5b6b80}
      .math {font-family:'DejaVu Serif',Georgia,serif;font-size:34px;font-style:italic;fill:#15263b}
      .smallmath {font-family:'DejaVu Serif',Georgia,serif;font-size:30px;font-style:italic;fill:#15263b}
      .flow {fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#forward)}
      .grad {fill:none;stroke:#cb6658;stroke-width:3;marker-end:url(#backward)}
      .learn {fill:none;stroke:#27817f;stroke-width:3;marker-end:url(#update)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="white"/>

  <!-- Observed input and target -->
  <text x="115" y="365" text-anchor="middle" class="math">x</text>
  <text x="115" y="415" text-anchor="middle" class="caption">Entrada</text>
  <path d="M160 353H253" class="flow"/>
  <text x="810" y="158" text-anchor="middle" class="math">y</text>
  <text x="870" y="156" class="caption">Target</text>
  <path d="M810 184V265" class="flow"/>

  <!-- Forward evaluation -->
  <rect x="265" y="275" width="290" height="170" rx="14" fill="#eaf2fc" stroke="#86a9d4" stroke-width="2"/>
  <text x="410" y="327" text-anchor="middle" class="label">Forward</text>
  <text x="410" y="384" text-anchor="middle" class="math">ŷ = f<tspan baseline-shift="sub" font-size="23">θ</tspan>(x)</text>
  <text x="410" y="419" text-anchor="middle" class="caption">Evaluar el modelo</text>
  <path d="M558 353H653" class="flow"/>
  <text x="607" y="328" text-anchor="middle" class="smallmath">ŷ</text>

  <!-- Scalar objective -->
  <rect x="665" y="275" width="290" height="170" rx="14" fill="#fff3e6" stroke="#d6a06b" stroke-width="2"/>
  <text x="810" y="327" text-anchor="middle" class="label">Pérdida</text>
  <text x="810" y="384" text-anchor="middle" class="math">L(y, ŷ)</text>
  <text x="810" y="419" text-anchor="middle" class="caption">Evaluar la predicción</text>
  <path d="M958 353H1053" class="flow"/>
  <text x="1007" y="328" text-anchor="middle" class="smallmath">L</text>

  <!-- Differentiation -->
  <rect x="1065" y="275" width="310" height="170" rx="14" fill="#f3eefb" stroke="#a698c6" stroke-width="2"/>
  <text x="1220" y="327" text-anchor="middle" class="label">Backward</text>
  <text x="1220" y="384" text-anchor="middle" class="math">g = ∇<tspan baseline-shift="sub" font-size="23">θ</tspan>L</text>
  <text x="1220" y="419" text-anchor="middle" class="caption">Calcular los gradientes</text>
  <path d="M1220 450V672H1018" class="grad"/>
  <text x="1110" y="640" text-anchor="middle" class="smallmath" fill="#cb6658">g</text>

  <!-- One explicit optimizer update, distinct from backward -->
  <rect x="615" y="597" width="390" height="150" rx="14" fill="#e9f5ef" stroke="#8abbaa" stroke-width="2"/>
  <text x="810" y="644" text-anchor="middle" class="label">Actualización</text>
  <text x="810" y="700" text-anchor="middle" class="math">θ′ = θ − ηg</text>
  <text x="810" y="800" text-anchor="middle" class="caption">Un paso de SGD</text>

  <!-- Updated parameters return to the same model -->
  <path d="M610 672H410V453" class="learn"/>
  <text x="508" y="640" text-anchor="middle" class="smallmath">θ′</text>
  <text x="270" y="725" class="caption">Parámetros actualizados</text>
</svg>
