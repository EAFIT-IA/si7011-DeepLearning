<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="100%" height="100%" fill="white"/><style>.t{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:44px;font-weight:700;fill:#153b63}.lbl{font-size:30px}.small{font-size:24px}.math{font-family:"Times New Roman",serif;font-size:34px;font-style:italic;fill:#172033}.box{fill:#f8fafc;stroke:#6b7d91;stroke-width:3;rx:16}.accent{fill:#eef6f7;stroke:#146c72;stroke-width:3;rx:16}.loss{fill:#fff6eb;stroke:#d38b33;stroke-width:3;rx:16}.arrow{stroke:#334155;stroke-width:4;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker></defs><text x="70" y="75" class="t title">S01-F14 — Computational graph</text><text x="70" y="125" class="t small">Same computation, represented as local operations.</text><rect x="90" y="330" width="150" height="90" class="box"/><text x="165" y="385" text-anchor="middle" class="math">w</text><rect x="90" y="500" width="150" height="90" class="box"/><text x="165" y="555" text-anchor="middle" class="math">x</text><rect x="365" y="400" width="180" height="110" class="accent"/><text x="455" y="445" text-anchor="middle" class="t lbl">multiply</text><text x="455" y="487" text-anchor="middle" class="math">a = wx</text><rect x="365" y="590" width="180" height="90" class="box"/><text x="455" y="645" text-anchor="middle" class="math">b</text><rect x="670" y="455" width="210" height="110" class="accent"/><text x="775" y="500" text-anchor="middle" class="t lbl">add</text><text x="775" y="542" text-anchor="middle" class="math">ŷ = a + b</text><rect x="670" y="650" width="210" height="90" class="box"/><text x="775" y="705" text-anchor="middle" class="math">y</text><rect x="1030" y="510" width="250" height="125" class="loss"/><text x="1155" y="560" text-anchor="middle" class="t lbl">loss</text><text x="1155" y="608" text-anchor="middle" class="math">L = (y − ŷ)²</text><path d="M240 375 L365 430" class="arrow"/><path d="M240 545 L365 485" class="arrow"/><path d="M545 455 L670 490" class="arrow"/><path d="M545 635 L670 540" class="arrow"/><path d="M880 510 L1030 555" class="arrow"/><path d="M880 695 L1030 610" class="arrow"/></svg>