<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#ffffff"/>
  <style>
    .title{font:700 52px Arial,Helvetica,sans-serif;fill:#102354}
    .h{font:700 32px Arial,Helvetica,sans-serif;fill:#172033}
    .t{font:26px Arial,Helvetica,sans-serif;fill:#172033}
    .s{font:22px Arial,Helvetica,sans-serif;fill:#445064}
    .m{font:italic 32px Georgia,'Times New Roman',serif;fill:#101820}
    .mm{font:italic 38px Georgia,'Times New Roman',serif;fill:#101820}
    .code{font:26px 'Courier New',monospace;fill:#2255cc}
    .box{stroke-width:2;rx:18;ry:18}
    .arrow{stroke:#172033;stroke-width:4;fill:none;marker-end:url(#arr)}
  </style>
  <defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#172033"/></marker></defs>
  <text x="800" y="70" text-anchor="middle" class="title">Binary classification: logits, sigmoid and BCE</text>
  
  <rect x="55" y="120" width="1490" height="315" rx="24" fill="#edf6ff"/>
  <rect x="80" y="185" width="230" height="140" class="box" fill="#d9eaff" stroke="#4285f4"/>
  <text x="195" y="230" text-anchor="middle" class="h">Input</text><text x="195" y="285" text-anchor="middle" class="mm">x</text>
  <path d="M310 255 H430" class="arrow"/>
  <rect x="435" y="175" width="285" height="160" class="box" fill="#e8f6df" stroke="#65a844"/>
  <text x="578" y="222" text-anchor="middle" class="h">Model</text><text x="578" y="282" text-anchor="middle" class="mm">fθ(x)</text>
  <path d="M720 255 H850" class="arrow"/>
  <text x="785" y="205" text-anchor="middle" class="h">logit z</text>
  <text x="785" y="315" text-anchor="middle" class="s">z ∈ ℝ · any real number</text>
  <rect x="855" y="175" width="270" height="160" class="box" fill="#efe2ff" stroke="#8e5de7"/>
  <text x="990" y="222" text-anchor="middle" class="h">Sigmoid</text><text x="990" y="282" text-anchor="middle" class="mm">σ(z)</text>
  <path d="M1125 255 H1260" class="arrow"/>
  <rect x="1265" y="175" width="250" height="160" class="box" fill="#d9eaff" stroke="#4285f4"/>
  <text x="1390" y="220" text-anchor="middle" class="h">Probability</text><text x="1390" y="278" text-anchor="middle" class="mm">p̂ ∈ [0,1]</text>

  <rect x="55" y="465" width="1490" height="255" rx="24" fill="#f2fbef"/>
  <text x="85" y="515" class="h">Binary cross-entropy</text>
  <text x="230" y="610" text-anchor="middle" class="m">z = fθ(x)</text>
  <line x1="420" y1="535" x2="420" y2="690" stroke="#cad4dd" stroke-width="2"/>
  <text x="690" y="595" text-anchor="middle" class="m">p̂ = σ(z) = 1 / (1 + e⁻ᶻ)</text>
  <line x1="965" y1="535" x2="965" y2="690" stroke="#cad4dd" stroke-width="2"/>
  <text x="1245" y="582" text-anchor="middle" class="m">ℓ = −[y log p̂ + (1−y) log(1−p̂)]</text>
  <text x="1245" y="640" text-anchor="middle" class="s">y ∈ {0,1}</text>

  <rect x="55" y="750" width="1490" height="105" rx="22" fill="#f3efff"/>
  <text x="90" y="805" class="h">PyTorch:</text><text x="310" y="805" class="code">nn.BCEWithLogitsLoss</text>
  <text x="750" y="805" class="t">expects logits z; sigmoid is applied internally.</text>

</svg>