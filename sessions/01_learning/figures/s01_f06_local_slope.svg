<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="100%" height="100%" fill="white"/><style>.t{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:44px;font-weight:700;fill:#153b63}.lbl{font-size:30px}.small{font-size:24px}.math{font-family:"Times New Roman",serif;font-size:34px;font-style:italic;fill:#172033}.accent{fill:#eef6f7;stroke:#146c72;stroke-width:3;rx:16}.back{stroke:#146c72;stroke-width:4;fill:none;marker-end:url(#arrow2)}</style><defs><marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#146c72"/></marker></defs><text x="70" y="75" class="t title">S01-F06 — The gradient is local information</text><text x="70" y="125" class="t small">At the current parameter value, the slope tells us how the loss changes nearby.</text><line x1="180" y1="720" x2="1420" y2="720" stroke="#334155" stroke-width="3"/><line x1="180" y1="720" x2="180" y2="190" stroke="#334155" stroke-width="3"/><path d="M220 250 C420 650,700 770,920 610 C1110 470,1210 300,1370 230" fill="none" stroke="#334155" stroke-width="5"/><circle cx="760" cy="685" r="10" fill="#172033"/><text x="735" y="755" class="math">wₜ</text><text x="95" y="230" class="math">L(w)</text><text x="1375" y="755" class="math">w</text><line x1="610" y1="745" x2="910" y2="625" stroke="#146c72" stroke-width="5"/><text x="910" y="590" class="t lbl">tangent</text><text x="930" y="640" class="math">∂L/∂w |₍wₜ₎</text><path d="M760 685 L650 730" class="back"/><text x="430" y="700" class="t small">negative gradient direction</text><rect x="980" y="420" width="410" height="150" class="accent"/><text x="1185" y="475" text-anchor="middle" class="t lbl">Gradient ≠ minimum</text><text x="1185" y="525" text-anchor="middle" class="t small">It only describes the local slope</text></svg>