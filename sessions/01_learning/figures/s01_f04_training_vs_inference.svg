<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#ffffff"/>
<style>
.title{font:700 48px Arial,Helvetica,sans-serif;fill:#153b63}
.h{font:700 30px Arial,Helvetica,sans-serif;fill:#172033}
.t{font:25px Arial,Helvetica,sans-serif;fill:#172033}
.s{font:21px Arial,Helvetica,sans-serif;fill:#4b596b}
.m{font:italic 30px 'DejaVu Serif','STIX Two Text','Times New Roman',serif;fill:#172033}
.mm{font:italic 36px 'DejaVu Serif','STIX Two Text','Times New Roman',serif;fill:#172033}
.code{font:24px 'Courier New',monospace;fill:#2255cc}
.arrow{stroke:#334155;stroke-width:4;fill:none;marker-end:url(#arr)}
.dash{stroke:#8895a7;stroke-width:2;stroke-dasharray:8 8}
</style>
<defs>
<marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker>
<marker id="tealarr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#146c72"/></marker>
</defs>
<text x="800" y="70" text-anchor="middle" class="title">Training versus inference</text>
<text x="400" y="125" text-anchor="middle" class="h">Training</text>
<text x="1200" y="125" text-anchor="middle" class="h">Inference</text>
<line x1="800" y1="120" x2="800" y2="810" stroke="#d5dde6" stroke-width="3"/>

<rect x="75" y="205" width="170" height="95" rx="16" fill="#d9eaff" stroke="#4285f4" stroke-width="2"/>
<text x="160" y="262" text-anchor="middle" class="mm">(x, y)</text>
<path d="M245 252 H330" class="arrow"/>
<rect x="340" y="190" width="220" height="125" rx="18" fill="#e8f6df" stroke="#65a844" stroke-width="2"/>
<text x="450" y="235" text-anchor="middle" class="h">model</text>
<text x="450" y="285" text-anchor="middle" class="mm">f<tspan baseline-shift="sub" font-size="22">θ</tspan>(x)</text>
<path d="M560 252 H650" class="arrow"/>
<rect x="660" y="205" width="110" height="95" rx="16" fill="#edf2f7" stroke="#6b7d91" stroke-width="2"/>
<text x="715" y="262" text-anchor="middle" class="mm">ŷ</text>

<path d="M715 300 V390" class="arrow"/>
<rect x="570" y="405" width="290" height="115" rx="18" fill="#fff6eb" stroke="#d38b33" stroke-width="2"/>
<text x="715" y="450" text-anchor="middle" class="h">loss</text>
<text x="715" y="495" text-anchor="middle" class="m">L(y, ŷ)</text>
<path d="M570 462 H455" class="arrow"/>
<rect x="220" y="405" width="220" height="115" rx="18" fill="#f3efff" stroke="#8e5de7" stroke-width="2"/>
<text x="330" y="448" text-anchor="middle" class="h">backward</text>
<text x="330" y="490" text-anchor="middle" class="m">∇<tspan baseline-shift="sub" font-size="20">θ</tspan>L</text>
<path d="M330 520 V620" class="arrow"/>
<rect x="205" y="635" width="250" height="105" rx="18" fill="#eef6f7" stroke="#146c72" stroke-width="2"/>
<text x="330" y="680" text-anchor="middle" class="h">optimizer step</text>
<text x="330" y="720" text-anchor="middle" class="s">parameters change</text>
<path d="M455 687 C610 687,650 565,525 315" fill="none" stroke="#146c72" stroke-width="4" marker-end="url(#tealarr)"/>

<rect x="890" y="250" width="170" height="95" rx="16" fill="#d9eaff" stroke="#4285f4" stroke-width="2"/>
<text x="975" y="307" text-anchor="middle" class="mm">x</text>
<path d="M1060 297 H1145" class="arrow"/>
<rect x="1155" y="235" width="230" height="125" rx="18" fill="#e8f6df" stroke="#65a844" stroke-width="2"/>
<text x="1270" y="280" text-anchor="middle" class="h">model</text>
<text x="1270" y="330" text-anchor="middle" class="mm">f<tspan baseline-shift="sub" font-size="22">θ</tspan>(x)</text>
<path d="M1385 297 H1460" class="arrow"/>
<rect x="1465" y="250" width="95" height="95" rx="16" fill="#edf2f7" stroke="#6b7d91" stroke-width="2"/>
<text x="1512" y="307" text-anchor="middle" class="mm">ŷ</text>

<rect x="920" y="500" width="590" height="150" rx="22" fill="#f8fafc" stroke="#9aa8b8" stroke-width="2"/>
<text x="1215" y="550" text-anchor="middle" class="h">Parameters are used, not updated</text>
<text x="1215" y="595" text-anchor="middle" class="t">no target y, no backward pass, no optimizer step</text>
</svg>