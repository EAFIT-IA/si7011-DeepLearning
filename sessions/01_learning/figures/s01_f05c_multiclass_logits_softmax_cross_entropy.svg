<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#ffffff"/>
  <style>
    .title{font:700 52px Arial,Helvetica,sans-serif;fill:#102354}
    .h{font:700 32px Arial,Helvetica,sans-serif;fill:#172033}
    .t{font:26px Arial,Helvetica,sans-serif;fill:#172033}
    .s{font:22px Arial,Helvetica,sans-serif;fill:#445064}
    .m{font:italic 32px Georgia,'Times New Roman',serif;fill:#101820}
    .mm{font:italic 38px Georgia,'Times New Roman',serif;fill:#101820}
    .code{font:26px 'Courier New',monospace;fill:#2255cc}
    .box{stroke-width:2;rx:18;ry:18}
    .arrow{stroke:#172033;stroke-width:4;fill:none;marker-end:url(#arr)}
  </style>
  <defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#172033"/></marker></defs>
  <text x="800" y="70" text-anchor="middle" class="title">Multiclass classification: logits, softmax and cross-entropy</text>
  
  <rect x="55" y="120" width="1490" height="320" rx="24" fill="#edf6ff"/>
  <rect x="75" y="185" width="210" height="140" class="box" fill="#d9eaff" stroke="#4285f4"/>
  <text x="180" y="230" text-anchor="middle" class="h">Input</text><text x="180" y="285" text-anchor="middle" class="mm">x</text>
  <path d="M285 255 H390" class="arrow"/>
  <rect x="395" y="175" width="265" height="160" class="box" fill="#e8f6df" stroke="#65a844"/>
  <text x="528" y="222" text-anchor="middle" class="h">Model</text><text x="528" y="282" text-anchor="middle" class="mm">fθ(x)</text>
  <path d="M660 255 H770" class="arrow"/>
  <rect x="775" y="160" width="205" height="190" rx="18" fill="#eef3ff" stroke="#77a6ff" stroke-width="2"/>
  <text x="878" y="200" text-anchor="middle" class="h">C logits</text>
  <text x="878" y="250" text-anchor="middle" class="m">z₁</text><text x="878" y="285" text-anchor="middle" class="m">⋮</text><text x="878" y="320" text-anchor="middle" class="m">z꜀</text>
  <path d="M980 255 H1085" class="arrow"/>
  <rect x="1090" y="175" width="235" height="160" class="box" fill="#efe2ff" stroke="#8e5de7"/>
  <text x="1208" y="222" text-anchor="middle" class="h">Softmax</text><text x="1208" y="282" text-anchor="middle" class="mm">p = softmax(z)</text>
  <path d="M1325 255 H1425" class="arrow"/>
  <text x="1470" y="215" text-anchor="middle" class="h">p₁</text><text x="1470" y="255" text-anchor="middle" class="h">⋮</text><text x="1470" y="300" text-anchor="middle" class="h">p꜀</text>
  <text x="1470" y="355" text-anchor="middle" class="s">Σ p꜀ = 1</text>

  <rect x="55" y="470" width="1490" height="245" rx="24" fill="#f2fbef"/>
  <text x="90" y="525" class="h">Cross-entropy for true class y</text>
  <text x="400" y="610" text-anchor="middle" class="m">p꜀ = exp(z꜀) / Σₖ exp(zₖ)</text>
  <line x1="760" y1="540" x2="760" y2="685" stroke="#cad4dd" stroke-width="2"/>
  <text x="1120" y="590" text-anchor="middle" class="mm">ℓ(z,y) = −log pᵧ</text>
  <text x="1120" y="645" text-anchor="middle" class="s">Increase the true-class logit relative to the others.</text>

  <rect x="55" y="750" width="1490" height="105" rx="22" fill="#f3efff"/>
  <text x="90" y="805" class="h">PyTorch:</text><text x="310" y="805" class="code">nn.CrossEntropyLoss</text>
  <text x="720" y="805" class="t">expects raw logits (B,C) and class indices y ∈ {0,…,C−1}.</text>

</svg>