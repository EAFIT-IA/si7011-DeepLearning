<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#ffffff"/>

<style>
.title{font:700 52px Arial,Helvetica,sans-serif;fill:#102354}
.h{font:700 30px Arial,Helvetica,sans-serif;fill:#172033}
.t{font:24px Arial,Helvetica,sans-serif;fill:#172033}
.s{font:20px Arial,Helvetica,sans-serif;fill:#445064}
.m{font:italic 30px 'DejaVu Serif','STIX Two Text','Times New Roman',serif;fill:#101820}
.mm{font:italic 36px 'DejaVu Serif','STIX Two Text','Times New Roman',serif;fill:#101820}
.code{font:25px 'Courier New',monospace;fill:#2255cc}
.arrow{stroke:#172033;stroke-width:4;fill:none;marker-end:url(#arr)}
.sep{stroke:#cbd5df;stroke-width:2}
</style>
<defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#172033"/></marker></defs>
<text x="800" y="70" text-anchor="middle" class="title">Multiclass classification: logits, softmax and cross-entropy</text>
<rect x="50" y="115" width="1500" height="325" rx="24" fill="#edf6ff"/>
<rect x="75" y="185" width="205" height="140" rx="18" fill="#d9eaff" stroke="#4285f4" stroke-width="2"/>
<text x="178" y="230" text-anchor="middle" class="h">Input</text>
<text x="178" y="285" text-anchor="middle" class="mm">x</text>

<path d="M280 255 H385" class="arrow"/>
<rect x="395" y="175" width="250" height="160" rx="18" fill="#e8f6df" stroke="#65a844" stroke-width="2"/>
<text x="520" y="220" text-anchor="middle" class="h">Model</text>
<text x="520" y="278" text-anchor="middle" class="mm">f<tspan baseline-shift="sub" font-size="22">θ</tspan>(x)</text>

<path d="M645 255 H735" class="arrow"/>
<rect x="745" y="155" width="210" height="200" rx="18" fill="#eef3ff" stroke="#77a6ff" stroke-width="2"/>
<text x="850" y="195" text-anchor="middle" class="h">C logits</text>
<text x="850" y="238" text-anchor="middle" class="s">z ∈ <tspan font-style="normal" font-weight="bold">R</tspan><tspan baseline-shift="super" font-size="14">C</tspan></text>
<text x="850" y="275" text-anchor="middle" class="m">z<tspan baseline-shift="sub" font-size="20">1</tspan>, ... , z<tspan baseline-shift="sub" font-size="20">c</tspan></text>

<path d="M955 255 H1040" class="arrow"/>
<rect x="1050" y="175" width="270" height="160" rx="18" fill="#efe2ff" stroke="#8e5de7" stroke-width="2"/>
<text x="1185" y="220" text-anchor="middle" class="h">Softmax</text>
<text x="1185" y="278" text-anchor="middle" class="m">p = softmax(z)</text>

<path d="M1320 255 H1400" class="arrow"/>
<rect x="1410" y="165" width="110" height="185" rx="16" fill="#d9eaff" stroke="#4285f4" stroke-width="2"/>
<text x="1465" y="215" text-anchor="middle" class="m">p<tspan baseline-shift="sub" font-size="20">1</tspan></text>
<text x="1465" y="255" text-anchor="middle" class="m">...</text>
<text x="1465" y="300" text-anchor="middle" class="m">p<tspan baseline-shift="sub" font-size="20">c</tspan></text>
<text x="1465" y="335" text-anchor="middle" class="s">sum = 1</text>

<rect x="50" y="470" width="1500" height="245" rx="24" fill="#f2fbef"/>
<text x="85" y="520" class="h">Cross-entropy for true class y</text>
<text x="400" y="600" text-anchor="middle" class="m">
p<tspan baseline-shift="sub" font-size="20">c</tspan> = e<tspan baseline-shift="super" font-size="18">z<tspan baseline-shift="sub" font-size="13">c</tspan></tspan> / Σ<tspan baseline-shift="sub" font-size="18">k</tspan> e<tspan baseline-shift="super" font-size="18">z<tspan baseline-shift="sub" font-size="13">k</tspan></tspan>
</text>
<line x1="770" y1="540" x2="770" y2="685" class="sep"/>
<text x="1135" y="585" text-anchor="middle" class="mm">
L(z,y) = -log p<tspan baseline-shift="sub" font-size="22">y</tspan>
</text>
<text x="1135" y="640" text-anchor="middle" class="s">Raise the true-class logit relative to the others.</text>

<rect x="50" y="750" width="1500" height="105" rx="22" fill="#f3efff"/>
<text x="85" y="805" class="h">PyTorch</text>
<text x="280" y="805" class="code">nn.CrossEntropyLoss</text>
<text x="690" y="805" class="t">expects raw logits (B,C) and class indices 0...(C-1).</text>
</svg>