<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#ffffff"/>
<style>
.title{font:700 48px Arial,Helvetica,sans-serif;fill:#153b63}
.h{font:700 30px Arial,Helvetica,sans-serif;fill:#172033}
