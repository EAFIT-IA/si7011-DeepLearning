<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="100%" height="100%" fill="white"/><style>.t{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:44px;font-weight:700;fill:#153b63}.lbl{font-size:30px}.small{font-size:24px}.math{font-family:"Times New Roman",serif;font-size:34px;font-style:italic;fill:#172033}.box{fill:#f8fafc;stroke:#6b7d91;stroke-width:3;rx:16}.accent{fill:#eef6f7;stroke:#146c72;stroke-width:3;rx:16}.loss{fill:#fff6eb;stroke:#d38b33;stroke-width:3;rx:16}</style><text x="70" y="75" class="t title">From mathematics to PyTorch</text><text x="70" y="125" class="t small">Each training-loop operation has a direct implementation.</text><text x="120" y="230" class="t lbl" font-weight="700">Concept</text><text x="560" y="230" class="t lbl" font-weight="700">Mathematics</text><text x="1030" y="230" class="t lbl" font-weight="700">PyTorch</text><rect x="90" y="280" width="330" height="100" class="box"/><text x="255" y="340" text-anchor="middle" class="t lbl">forward</text><rect x="500" y="280" width="390" height="100" class="accent"/><text x="695" y="340" text-anchor="middle" class="math">ŷ = fθ(x)</text><rect x="970" y="280" width="500" height="100" class="box"/><text x="1220" y="340" text-anchor="middle" class="t lbl">y_hat = model(x)</text><rect x="90" y="420" width="330" height="100" class="box"/><text x="255" y="480" text-anchor="middle" class="t lbl">loss</text><rect x="500" y="420" width="390" height="100" class="loss"/><text x="695" y="480" text-anchor="middle" class="math">L(y, ŷ)</text><rect x="970" y="420" width="500" height="100" class="box"/><text x="1220" y="480" text-anchor="middle" class="t lbl">loss = criterion(...)</text><rect x="90" y="560" width="330" height="100" class="box"/><text x="255" y="620" text-anchor="middle" class="t lbl">gradient</text><rect x="500" y="560" width="390" height="100" class="accent"/><text x="695" y="620" text-anchor="middle" class="math">∇θL</text><rect x="970" y="560" width="500" height="100" class="box"/><text x="1220" y="620" text-anchor="middle" class="t lbl">loss.backward()</text><rect x="90" y="700" width="330" height="100" class="box"/><text x="255" y="760" text-anchor="middle" class="t lbl">update</text><rect x="500" y="700" width="390" height="100" class="accent"/><text x="695" y="760" text-anchor="middle" class="math">θ′ = θ − η∇θL</text><rect x="970" y="700" width="500" height="100" class="box"/><text x="1220" y="760" text-anchor="middle" class="t lbl">optimizer.step()</text></svg>